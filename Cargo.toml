[package]
name = "nonaut"
version = "0.0.1"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29.0", features = ["event-stream"] }
diffy = "0.5.2"
directories = "6.0.0"
futures-util = "0.3.34"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
ratatui-textarea = "0.9.3"
serde_json = "1.0.149"
tokio = { version = "1.53.0", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tui-markdown = { version = "0.3.11", default-features = false }
webbrowser = { version = "1.2.4", features = ["hardened"] }
